name: Release & Build Multiplatform Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-13'
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build and Publish Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'WorkBuddy 皮肤管理器 ${{ github.ref_name }}'
          releaseBody: '### 🎉 WorkBuddy 皮肤与主题管理器 ${{ github.ref_name }} 发布\n\n- 跨平台原生支持：macOS (Apple Silicon / Intel) 与 Windows (x64)\n- 非侵入式热换肤与 CDP 协议即时注入\n- 内置精选主题与可视化微调器'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
